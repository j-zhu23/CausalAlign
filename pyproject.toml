[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalalign-paper"
version = "1.0.0"
description = "Reproducible three-stage CausalAlign training for Wan2.2"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "safetensors>=0.4",
]

[project.optional-dependencies]
wan = ["diffusers>=0.35.1,<0.40", "transformers>=4.49", "accelerate>=1.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["causalalign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

